# Paved-path CI (GitHub Actions). Same gates as the GitLab template:
# lint -> test -> build+scan. The service matrix is what makes this scale:
# adding a service to the repo adds it to every pipeline automatically.
#
# Branches and PRs run this workflow; tags run release.yml (the promotion
# pipeline), mirroring the GitLab split between branch and tag pipelines.

name: ci
on:
  pull_request:
  # Pushes to main only (not every branch): a push to a feature branch that
  # has an open PR would otherwise fire BOTH this and the pull_request event,
  # running CI twice for the same commit. Feature branches get their runs from
  # pull_request; main gets them here (direct pushes and merges).
  push:
    branches: [main]

# Least privilege for the workflow token. CI only reads the repo (checkout);
# it never writes, comments, or mints tokens. The release workflow declares
# its own (wider) permissions.
permissions:
  contents: read

# One pipeline per branch at a time; a newer push supersedes the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflow files are code; lint them in the same pipeline they run.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          wget -qO /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          # Verify the download before running it (same supply-chain stance as
          # the cosign/syft installs in release.yml). Checksum verified against
          # the v1.7.12 asset.
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
      # shellcheck is the same idea for the bash scripts.
      - run: |
          wget -qO /tmp/shellcheck.tgz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tgz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tgz -C /usr/local/bin --strip-components=1 shellcheck-v0.10.0/shellcheck
      # No args: actionlint finds every workflow under .github/workflows.
      - run: actionlint
      - run: shellcheck scripts/*.sh
      # The GitLab templates are included from a root .gitlab-ci.yml this repo
      # doesn't have (this repo IS the template), so `glab ci lint` can't run
      # here. Validate them against GitLab's own CI schema instead — the same
      # check `make ci-lint` runs locally. This catches config bugs a plain YAML
      # parse misses (e.g. a job-level `entrypoint`, which GitLab silently
      # ignores). check-jsonschema is pinned because its bundled vendor.gitlab-ci
      # schema changes between versions; the pin keeps CI and a fresh local run
      # on the same schema. Installed in a throwaway venv so it works on PEP 668
      # (externally-managed) runners. Same "install from a trusted registry"
      # stance as the govulncheck install in the scan job.
      - run: |
          python3 -m venv /tmp/cjs
          /tmp/cjs/bin/pip install --quiet check-jsonschema==0.38.2
          /tmp/cjs/bin/check-jsonschema --builtin-schema vendor.gitlab-ci .gitlab/ci/*.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: false }
      # Go toolchain must match go.mod's declared version. On GitHub setup-go
      # installs it FROM go.mod, so this is a lockstep no-op here — but the
      # identical check on GitLab (pp:lint) guards the real risk: $GO_IMAGE
      # drifting from go.mod, which would let the shipped binary's stdlib (and
      # its CVE surface) silently diverge from what go.mod promises. awk, not
      # jq: the golang image has no jq.
      - run: |
          [ "$(go env GOVERSION)" = "go$(awk '$1=="go"{print $2}' go.mod)" ] \
            || { echo "Go toolchain drift: $(go env GOVERSION) vs go.mod"; exit 1; }
      # gofmt is a hard gate (same check as `make lint` and the GitLab pp:lint
      # job): a non-empty list of unformatted files fails. gofmt ships with the
      # Go toolchain, so no extra install.
      - run: |
          test -z "$(gofmt -l .)" || { echo 'unformatted (run: gofmt -w <file>)'; gofmt -l .; exit 1; }
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: false }
      - run: go test ./...
      # Race detector on every commit. ubuntu-latest has a C toolchain, so no
      # extra setup; the GitLab job installs build-base for the same gate.
      - run: CGO_ENABLED=1 go test -race ./...

  # Build and scan in ONE job: the image lands in this runner's daemon, so
  # trivy reads it via the socket. Splitting build and scan across jobs would
  # require pushing to a registry just to hand the artifact over. (The tag
  # pipeline in release.yml does push, because promotion needs a registry.)
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Plain `docker build` (default builder): the image lands in the local
      # daemon, which is what trivy needs to find it. A buildx container-
      # driver builder would leave it in the build cache instead.
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t "paved-path/${{ matrix.service }}:${GITHUB_SHA}" .
      # Same trivy image and command as the GitLab template (pp:image-scan).
      # The trivy image's entrypoint IS the tool; clear it so we can run a
      # shell (same as the GitLab job). The ref is expanded on the runner
      # (bash) and passed in single quotes, because $GITHUB_SHA is not set
      # inside the trivy container. No ignore file: the gate fails on stdlib
      # CVEs embedded in a static binary; when one lands, bump Go to clear it.
      # Pinned by tag AND digest: the tag (0.53.0) is what Renovate tracks
      # against the version series, and the digest pins the exact bytes (a
      # re-push of :0.53.0 would otherwise silently swap the scanner). Renovate
      # rewrites both in one PR (see renovate.json5's trivy custom manager).
      - run: |
          img="paved-path/${{ matrix.service }}:${GITHUB_SHA}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint "" aquasec/trivy:0.53.0@sha256:53e6715d5c67e80e629f0dfa3bd6ed2bc74bdcaa4bdbe934a5a1811a249db6b9 sh -c \
            "trivy image --exit-code 1 --severity HIGH,CRITICAL '$img'"

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: false }
      # Pinned, not @latest (see Makefile). v1.9.0 requires Go >= 1.26;
      # go.mod declares 1.27, so setup-go above already satisfies it.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
