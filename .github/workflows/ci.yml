# Paved-path CI (GitHub Actions). Same gates as the GitLab template:
# lint -> test -> build -> scan. The service matrix is what makes this scale:
# adding a service to the repo adds it to every pipeline automatically.

name: ci
on: [push, pull_request]

env:
  SERVICES: gateway,billing,worker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(fmt('["%s"]', env.SERVICES)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t "paved-path/${{ matrix.service }}:${GITHUB_SHA}" .

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
