# Paved-path CI (GitHub Actions). Same gates as the GitLab template:
# lint -> test -> build -> scan. The service matrix is what makes this scale:
# adding a service to the repo adds it to every pipeline automatically.

name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t "paved-path/${{ matrix.service }}:${GITHUB_SHA}" .

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Same image scan as the GitLab template (pp:image-scan): HIGH/CRITICAL
  # findings fail the pipeline. Rebuilds locally so it runs without a registry.
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t "paved-path/${{ matrix.service }}:${GITHUB_SHA}" .
      - uses: aquasec/trivy-action@0.24.0
        with:
          image-ref: "paved-path/${{ matrix.service }}:${GITHUB_SHA}"
          severity: HIGH,CRITICAL
          exit-code: "1"
