# Release promotion (GitHub Actions). Mirrors .gitlab/ci/release.yml: the
# SHA image that passed build+scan is promoted (retagged), signed, and gets
# an SBOM. Nothing else ships.
#
# ci.yml owns branches/PRs; this workflow owns tags, so a tag push runs the
# full gate (lint -> test -> build+scan) and then promotion, in that order
# via `needs:` — the same stage ordering as the GitLab tag pipeline.

name: release
on:
  push:
    # Stable tags and release candidates (v1.2.3-rc.1). The GitLab rule
    # regex matches the same set (see .gitlab/ci/release.yml).
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read
  packages: write   # push/pull images on GHCR (image, image-scan, promote,
                    # sign, sbom all touch the registry)
  # id-token: write is NOT here. Only the sign job needs it (cosign keyless
  # signing mints a Sigstore OIDC token), so it is declared at that job's
  # level below — least privilege, and a leaked workflow token can't mint OIDC
  # tokens from the other jobs.

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: CGO_ENABLED=1 go test -race ./...

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
      # Promote, never rebuild: if the SHA image is already in the registry
      # (from an earlier run of this same job, e.g. a retry after sign failed),
      # use it as-is instead of rebuilding. The tag is the SHA, so an existing
      # image was built from this exact commit; and with digest-pinned inputs a
      # rebuild would be byte-identical anyway. image-scan still validates what's
      # in the registry, so skipping the build doesn't skip the gate.
      - run: |
          img="$REGISTRY/${{ github.repository }}/${{ matrix.service }}:$GITHUB_SHA"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "SHA image already in registry; skipping rebuild"
            exit 0
          fi
          docker build --build-arg SERVICE=${{ matrix.service }} -t "$img" .
          docker push "$img"

  scan:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  image-scan:
    needs: [image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
      # Same trivy image and command as the GitLab template (pp:image-scan).
      # The ref is expanded on the runner and passed in single quotes, because
      # $REGISTRY/$GITHUB_SHA are not set inside the trivy container. No
      # ignore file: a Go 1.27 build embeds a stdlib with no known
      # HIGH/CRITICAL CVEs, so the gate is fully real.
      - run: |
          img="$REGISTRY/${{ github.repository }}/${{ matrix.service }}:$GITHUB_SHA"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint "" aquasec/trivy@sha256:53e6715d5c67e80e629f0dfa3bd6ed2bc74bdcaa4bdbe934a5a1811a249db6b9 sh -c \
            "trivy image --exit-code 1 --severity HIGH,CRITICAL '$img'"

  promote:
    needs: [scan, image-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
      # Promotion = retag the SHA image that passed build+scan, then push the
      # tag. No rebuild: the exact bytes that were tested are what ships.
      - run: |
          img="$REGISTRY/${{ github.repository }}/${{ matrix.service }}"
          docker pull "$img:$GITHUB_SHA"
          docker tag  "$img:$GITHUB_SHA" "$img:${GITHUB_REF_NAME}"
          docker push "$img:${GITHUB_REF_NAME}"

  sign:
    needs: [promote]
    # The only job that mints an OIDC token, so id-token: write lives here,
    # not at the workflow level (see permissions above).
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Sigstore OIDC)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
      # Same cosign version as the GitLab template. Official static binary,
      # verified against the release's own checksums file (the official image
      # has no shell; `go install` works for cosign but not for syft, so both
      # use binaries to stay in lockstep). Keyless signing uses the runner's
      # built-in OIDC (permissions: id-token: write above); cosign picks it up
      # automatically on GitHub Actions.
      - run: |
          wget -qO /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign-linux-amd64
          wget -qO /tmp/cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign_checksums.txt
          (cd /tmp && grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -)
          install /tmp/cosign-linux-amd64 /usr/local/bin/cosign
      - run: cosign sign --yes "$REGISTRY/${{ github.repository }}/${{ matrix.service }}:${GITHUB_REF_NAME}"

  sbom:
    needs: [promote]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, billing, worker]
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
      # Same syft version as the GitLab template. Official static binary,
      # verified against the release's own checksums file: `go install`
      # rejects syft v1.14.0 (replace directive in its go.mod).
      - run: |
          wget -qO /tmp/syft_1.14.0_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_linux_amd64.tar.gz
          wget -qO /tmp/syft_checksums.txt https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_checksums.txt
          (cd /tmp && grep " syft_1.14.0_linux_amd64.tar.gz$" syft_checksums.txt | sha256sum -c -)
          tar -xzf /tmp/syft_1.14.0_linux_amd64.tar.gz -C /usr/local/bin syft
      - run: syft image "$REGISTRY/${{ github.repository }}/${{ matrix.service }}:${GITHUB_REF_NAME}" --output spdx-json="sbom-${{ matrix.service }}-${GITHUB_REF_NAME}.spdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: "sbom-${{ matrix.service }}-*.spdx.json"
