# Root GitLab CI config. This repo is the paved-path template, and these two
# files are the templates — but they only run if something includes them. This
# is that something: it makes the templates execute in this repo's own pipeline,
# which is how they get exercised (a template that has never run is a guess).
#
# Everything else — stages, jobs, the tag-only release rule — lives in the two
# included files. base.yml owns lint/test/build/scan; release.yml owns the
# tag-only promote/sign/sbom jobs. No variables are set here: base.yml defines
# its own (GO_IMAGE, GOVULNCHECK_VERSION) and the release jobs use GitLab
# built-ins (CI_REGISTRY*, CI_SERVER_URL, CI_CONFIG_REF_URI).
include:
  - .gitlab/ci/base.yml
  - .gitlab/ci/release.yml

# Instance-level prerequisites (not expressible in this file):
#   - A runner with Docker-in-Docker for the build/scan/release jobs.
#   - Keyless signing (Sigstore) is built into GitLab.com on the Free tier and
#     above — there is no toggle to enable. pp:sign-release and pp:sbom declare
#     id_tokens (aud: sigstore); GitLab sets SIGSTORE_ID_TOKEN and cosign picks
#     it up automatically. (Self-managed instances need OIDC/Sigstore configured
#     instead — see doc/ci/yaml/signing_self_hosted.md.)
#   - GitLab 19.0+ for CI_CONFIG_REF_URI (the release jobs fail loudly below it).
