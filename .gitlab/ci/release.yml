# Release promotion (GitLab). Include alongside base.yml; runs only on tags.
# The same artifact built from the tag is signed, gets an SBOM, and lands in a
# release manifest. Nothing else reaches production.

pp:release-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

pp:sign-release:
  stage: scan
  image: gcr.io/go-releaser/cosign:v2.4.0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - cosign sign --yes $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

pp:sbom:
  stage: scan
  image: anchore/syft:1.14.0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - syft image $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --output spdx-json=release-$CI_COMMIT_TAG.spdx.json
  artifacts:
    paths: [release-*.spdx.json]
