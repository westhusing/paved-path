# Release promotion (GitLab). Include alongside base.yml; runs only on tags.
# The same artifact built from the tag is promoted, signed, and gets an SBOM.
# Nothing else reaches production.

# Promotion = retag the SHA image that already passed build+scan, then push
# the tag. We deliberately do NOT rebuild here: rebuilding on the tag would
# produce new bytes and break "the exact image that passed tests is what
# reaches prod". (The SHA image exists because pp:image in base.yml runs on
# tag pipelines too, and the release stage orders after build+scan.)

# Tag rule, inlined in each job below on purpose: GitLab does not expand
# nested variables inside rules:if (a variable whose value contains another
# $VAR reference keeps it literal), so the regex cannot live in a shared
# variable. Stable versions (v1.2.3) and release candidates (v1.2.3-rc.1);
# the GitHub workflow matches the same set with filter patterns (see
# .github/workflows/release.yml). Keep them in sync.
pp:release-image:
  stage: release
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services: ["docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # --password-stdin keeps the password out of `ps` output.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    - docker tag  $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG

# cosign and syft run from official static binaries on the golang image
# rather than their official images: those images have no shell (their
# entrypoint IS the tool), and GitLab needs a shell to run script lines.
# `go install` is out too: syft v1.14.0's go.mod has a replace directive,
# which `go install` rejects. Each binary is verified against the release's
# own checksums file before use — a download step that doesn't check its
# bytes is just an unpinned dependency with extra steps. Same tool versions
# as the GitHub release workflow: cosign v2.4.0, syft v1.14.0.
pp:sign-release:
  stage: release
  image: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  # Keyless signing needs an OIDC token; GitLab mints one for this job.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # No docker CLI in this image; cosign reads registry credentials from
    # the standard docker config, so write it directly.
    - mkdir -p ~/.docker && printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)" > ~/.docker/config.json
    - wget -qO /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign-linux-amd64
    - wget -qO /tmp/cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign_checksums.txt
    - (cd /tmp && grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -)
    - install /tmp/cosign-linux-amd64 /usr/local/bin/cosign
  script:
    - cosign sign --yes $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG

pp:sbom:
  stage: release
  image: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # No docker CLI in this image; syft reads registry credentials from
    # the standard docker config, so write it directly.
    - mkdir -p ~/.docker && printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)" > ~/.docker/config.json
    - wget -qO /tmp/syft_1.14.0_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_linux_amd64.tar.gz
    - wget -qO /tmp/syft_checksums.txt https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_checksums.txt
    - (cd /tmp && grep " syft_1.14.0_linux_amd64.tar.gz$" syft_checksums.txt | sha256sum -c -)
    - tar -xzf /tmp/syft_1.14.0_linux_amd64.tar.gz -C /usr/local/bin syft
  script:
    - syft image $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG --output spdx-json=release-$SERVICE-$CI_COMMIT_TAG.spdx.json
  artifacts:
    paths: [release-*.spdx.json]
