# Release promotion (GitLab). Include alongside base.yml; runs only on tags.
# The same artifact built from the tag is promoted, signed, and gets an SBOM.
# Nothing else reaches production.

# Promotion = retag the SHA image that already passed build+scan, then push
# the tag. We deliberately do NOT rebuild here: rebuilding on the tag would
# produce new bytes and break "the exact image that passed tests is what
# reaches prod". (The SHA image exists because pp:image in base.yml runs on
# tag pipelines too, and the release stage orders after build+scan.)

# Tag rule, inlined in each job below on purpose: GitLab does not expand
# nested variables inside rules:if (a variable whose value contains another
# $VAR reference keeps it literal), so the regex cannot live in a shared
# variable. Stable versions (v1.2.3) and release candidates (v1.2.3-rc.1);
# the GitHub workflow matches the same set with filter patterns (see
# .github/workflows/release.yml). Keep them in sync.
pp:release-image:
  stage: release
  # CLI-only job image (see pp:image in base.yml for why not docker:27).
  # Promotion only pulls/tags/pushes — it never builds — so the daemon comes
  # from the dind service, not this image.
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services: ["docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # --password-stdin keeps the password out of `ps` output.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    - docker tag  $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG

# cosign and syft run from official static binaries on the golang image
# rather than their official images: those images have no shell (their
# entrypoint IS the tool), and GitLab needs a shell to run script lines.
# `go install` is out too: syft v1.14.0's go.mod has a replace directive,
# which `go install` rejects. Each binary is verified against the release's
# own checksums file before use — a download step that doesn't check its
# bytes is just an unpinned dependency with extra steps. Same tool versions
# as the GitHub release workflow: cosign v2.4.0, syft v1.14.0.
pp:sign-release:
  stage: release
  # docker:27-cli (not the golang image) so we can resolve the tag to a digest
  # with `docker buildx imagetools inspect` and sign by DIGEST. A signature on
  # a tag is tied to whatever the tag points at; a signature on a digest is
  # tied to the exact bytes — which matches "the promoted artifact is what's
  # signed".
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  # Keyless signing needs an OIDC token; GitLab mints one for this job.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  # Must run after promotion: we sign the tag that pp:release-image just
  # pushed. Without this, all release-stage jobs start in parallel and signing
  # races the push (flaky releases). Waiting for all promote instances is a
  # slight over-wait but correct, and matches the GitHub workflow's needs.
  # Quoted: an unquoted colon in a flow sequence is invalid YAML (Psych
  # rejects it), and GitLab parses with Psych.
  needs: ["pp:release-image"]
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # Authenticate to the registry exactly like pp:release-image (and GitHub)
    # do: docker login. It needs no daemon — it talks straight to the registry's
    # /v2/ endpoint and writes ~/.docker/config.json, which cosign (and buildx,
    # for the digest lookup) read via go-containerregistry. Hand-writing that
    # file was the fragile step; reusing the same command as the job that already
    # pushes successfully removes a whole class of mismatch.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - wget -qO /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign-linux-amd64
    - wget -qO /tmp/cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign_checksums.txt
    - (cd /tmp && grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -)
    - install /tmp/cosign-linux-amd64 /usr/local/bin/cosign
  script:
    # Resolve the tag to its digest, then sign by digest. Fail loudly if we
    # can't resolve it — signing a tag we couldn't pin would be worse than no
    # signature. Then verify the signature (keyless): a sign that can't be
    # verified is not a signature. There is no --yes on verify.
    - |-
      # CI_CONFIG_REF_URI (GitLab 19.0+) is the exact claim Fulcio uses for the
      # cert SAN; on older GitLab it's empty and "https://" alone would make
      # cosign verify fail with a confusing mismatch. Fail loudly instead. We
      # don't fall back to reconstructing it from CI_SERVER_URL/CI_PROJECT_PATH/
      # CI_CONFIG_PATH: those could subtly differ from Fulcio's build_server_
      # fqdn/full_path/ci_config, and a subtle mismatch is exactly the confusing
      # error we're avoiding.
      [ -n "$CI_CONFIG_REF_URI" ] || { echo "needs GitLab 19.0+ (CI_CONFIG_REF_URI)"; exit 1; }
      digest=$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG" 2>/dev/null | grep -m1 'Digest:' | awk '{print $2}')
      [ -n "$digest" ] || { echo "could not resolve digest for $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG"; exit 1; }
      img="$CI_REGISTRY_IMAGE/$SERVICE@$digest"
      echo "signing $img"
      cosign sign --yes "$img"
      # Keyless verify: the identity is the signing cert's URI SAN, which Fulcio
      # builds from ci_config_ref_uri — exposed to the job as $CI_CONFIG_REF_URI
      # (GitLab 19.0+). The issuer is the instance URL, $CI_SERVER_URL. Both are
      # GitLab's own variables, so no hardcoded owner/repo/instance: a copied
      # template verifies on any instance. (https:// is Fulcio's scheme for the
      # SAN; instances are HTTPS.)
      cosign verify \
        --certificate-oidc-issuer "$CI_SERVER_URL" \
        --certificate-identity "https://$CI_CONFIG_REF_URI" \
        "$img"

pp:sbom:
  stage: release
  # docker:27-cli so we can resolve the tag to a digest and generate the SBOM
  # for the exact bytes that were promoted (see pp:sign-release).
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  # Same ordering reason as pp:sign-release: the SBOM describes the promoted
  # tag, so it must exist first. (Quoted for the same YAML reason as above.)
  needs: ["pp:release-image"]
  # cosign attest mints a keyless OIDC token to bind the SBOM to the image,
  # same as cosign sign in pp:sign-release.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # Authenticate to the registry exactly like pp:release-image (and GitHub)
    # do: docker login. It needs no daemon — it talks straight to the registry's
    # /v2/ endpoint and writes ~/.docker/config.json, which syft + cosign (both
    # go-containerregistry) read. Same reason as pp:sign-release.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - wget -qO /tmp/syft_1.14.0_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_linux_amd64.tar.gz
    - wget -qO /tmp/syft_checksums.txt https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_checksums.txt
    - (cd /tmp && grep " syft_1.14.0_linux_amd64.tar.gz$" syft_checksums.txt | sha256sum -c -)
    - tar -xzf /tmp/syft_1.14.0_linux_amd64.tar.gz -C /usr/local/bin syft
    # cosign binds the SBOM to the image (attest) and verifies it — same
    # binary + checksum verification as pp:sign-release.
    - wget -qO /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign-linux-amd64
    - wget -qO /tmp/cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v2.4.0/cosign_checksums.txt
    - (cd /tmp && grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -)
    - install /tmp/cosign-linux-amd64 /usr/local/bin/cosign
  script:
    # SBOM for the digest, not the tag: the bill of materials should describe
    # the exact bytes that shipped. Then bind it to the image with a cosign
    # attestation (keyless) and verify: an SBOM that is just an artifact file
    # can be detached from the image; an attestation ties it to the exact
    # digest in Rekor. Keyless mode needs identity + issuer (COSIGN_* above);
    # there is no --yes on verify-attestation.
    - |-
      # Same GitLab 19.0+ guard as pp:sign-release (see there for why we don't
      # fall back to reconstructing CI_CONFIG_REF_URI from other variables).
      [ -n "$CI_CONFIG_REF_URI" ] || { echo "needs GitLab 19.0+ (CI_CONFIG_REF_URI)"; exit 1; }
      digest=$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG" 2>/dev/null | grep -m1 'Digest:' | awk '{print $2}')
      [ -n "$digest" ] || { echo "could not resolve digest for $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG"; exit 1; }
      img="$CI_REGISTRY_IMAGE/$SERVICE@$digest"
      echo "generating SBOM for $img"
      # syft v1.14.0 has no `image` subcommand (removed in favor of the unified
      # `scan`) — see the GitHub sbom job for why. Same binary + version there.
      syft scan "$img" --output spdx-json=release-$SERVICE-$CI_COMMIT_TAG.spdx.json
      cosign attest --predicate "release-$SERVICE-$CI_COMMIT_TAG.spdx.json" --type spdxjson --yes "$img"
      # Verify the attestation (keyless). Same identity + issuer as
      # pp:sign-release — see there for why $CI_CONFIG_REF_URI / $CI_SERVER_URL.
      # There is no --yes on verify-attestation either.
      cosign verify-attestation --type spdxjson \
        --certificate-oidc-issuer "$CI_SERVER_URL" \
        --certificate-identity "https://$CI_CONFIG_REF_URI" \
        "$img"
  artifacts:
    paths: [release-*.spdx.json]
