# Paved-path CI template (GitLab). Adopt from your project's .gitlab-ci.yml:
#
#   include:
#     - local: '.gitlab/ci/base.yml'
#
# Every change gets the same gates, in order: lint -> test -> build+scan.
# The service matrix is what makes this scale: adding a service to the repo
# adds it to every pipeline automatically — no per-service CI editing.

# The release stage is empty on branch pipelines; tag pipelines fill it
# (see release.yml). Keeping the stage here means promotion always runs
# AFTER build and scan, so it can only promote images that passed.
stages:
  - lint
  - test
  - build
  - scan
  - release

# Top-level variables, not top-level keys. A bare `GO_IMAGE: ...` at the
# root of a .gitlab-ci.yml is parsed as a JOB named GO_IMAGE (GitLab treats
# any top-level mapping key that isn't a known keyword as a job), so these
# must live under `variables:` to be usable as $GO_IMAGE.
variables:
  # Go version must match go.mod (see AGENTS.md). The digest pins the exact
  # patch (1.27.2); go.mod declares the same, so setup-go on GitHub installs
  # the identical toolchain. Newer Go is what keeps the stdlib CVEs out of
  # static binaries — see the image-scan job below.
  GO_IMAGE: golang:1.27-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
  # govulncheck is pinned, not @latest: an unpinned tool version in a
  # "reproducible" repo is the same class of bug as an unpinned base image.
  # v1.9.0 requires Go >= 1.26, which the image above satisfies.
  GOVULNCHECK_VERSION: v1.9.0

pp:lint:
  stage: lint
  image: $GO_IMAGE
  script:
    - go vet ./...

# Same bash gate as the GitHub actionlint job: shellcheck on every script.
# (GitLab validates .gitlab-ci.yml itself when it creates the pipeline, so
# there is no separate YAML linter to run here; GitHub gets actionlint for
# its workflow files.) The binary is x86_64 because GitLab.com shared
# runners are; on an arm64 runner, swap in the .linux.aarch64 asset.
pp:shellcheck:
  stage: lint
  image: $GO_IMAGE
  script:
    - wget -qO /tmp/shellcheck.tgz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
    # shellcheck ships no checksums file, so the hash is pinned here. A
    # download step that doesn't check its bytes is an unpinned dependency.
    - echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tgz" | sha256sum -c -
    - tar -xJf /tmp/shellcheck.tgz -C /usr/local/bin --strip-components=1 shellcheck-v0.10.0/shellcheck
    - shellcheck scripts/*.sh

pp:test:
  stage: test
  image: $GO_IMAGE
  script:
    - go test ./...

# Race detector on every commit. The alpine image has no C compiler and
# -race needs cgo, so build-base is installed for this job only. The GitHub
# runner has a toolchain already, so it runs the same gate with no setup.
pp:race:
  stage: test
  image: $GO_IMAGE
  script:
    - apk add --no-cache build-base
    - CGO_ENABLED=1 go test -race ./...

pp:image:
  stage: build
  # The job image is the CLI-only variant (docker:27-cli): it needs the docker
  # client to build/push and talks to the dind service below for the daemon.
  # It is deliberately a DIFFERENT image than the service — docker:27 and
  # docker:27-dind are the same full image (identical digest), so pinning both
  # to it would read as a copy-paste error. docker:27-cli has no dockerd, which
  # is exactly what a build job should not carry. (GitLab's docker executor
  # detects the shell and falls back to sh; this image has sh, no bash.)
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services: ["docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"]
  variables:
    DOCKER_BUILDKIT: "1"
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  before_script:
    # --password-stdin keeps the password out of `ps` output.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Promote, never rebuild: if the SHA image already exists (pushed by a
    # branch pipeline for this commit), use it as-is. Rebuilding the same
    # commit with digest-pinned inputs would produce identical bytes, but we
    # don't need to rely on that.
    - |
      if docker manifest inspect "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA" >/dev/null 2>&1; then
        echo "SHA image already in registry; skipping rebuild"
        exit 0
      fi
    - docker build --build-arg SERVICE=$SERVICE -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA .
    # Push the immutable SHA image. Release promotion (release.yml) retags
    # THIS exact artifact; it never rebuilds.
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA

pp:scan:
  stage: scan
  image: $GO_IMAGE
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION
    - govulncheck ./...

pp:image-scan:
  stage: scan
  # Digest-pinned, same image and command as the GitHub workflow. The trivy
  # image's entrypoint IS the tool; GitLab needs a shell to run script lines,
  # so clear it (GitLab's documented trivy setup).
  #
  # entrypoint lives INSIDE the object-form image, not at job level: GitLab's
  # valid job keywords don't include a bare `entrypoint` (it's an imageable
  # key, like name/ports/pull_policy). A job-level one is silently ignored,
  # which leaves trivy's own entrypoint in place and the script runs as
  # `trivy <shell> ...` — a failure that only shows up at runtime, not in the
  # YAML. (The runner's overwriteEntrypoint returns nil when no image-level
  # entrypoint is set, so the image default wins.)
  #
  # No ignore file: the gate is fully real. trivy's Go scanner reports CVEs in
  # the standard library embedded in a static binary, so this gate is only as
  # clean as the toolchain that built the image (see GO_IMAGE above). If a
  # future Go stdlib CVE lands and this starts failing, the fix is to bump Go,
  # not to add a .trivyignore — an ignore file would make the gate decorative.
  # (The trivy DB download is not cached: it's a few MB, and caching it would
  # add a cache key to keep in sync for little gain.)
  image:
    name: aquasec/trivy@sha256:53e6715d5c67e80e629f0dfa3bd6ed2bc74bdcaa4bdbe934a5a1811a249db6b9
    entrypoint: [""]
  parallel:
    matrix:
      - SERVICE: ["gateway", "billing", "worker"]
  # The trivy image has no docker CLI, so registry auth goes through trivy's
  # own env vars instead of `docker login`.
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
